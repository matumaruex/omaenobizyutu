<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <filter id="pigment" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".008 .012" numOctaves="3" seed="17" stitchTiles="stitch"/>
    <feColorMatrix values=".10 0 0 0 .456  0 .11 0 0 .639  0 0 .10 0 .421  0 0 0 0 1"/>
  </filter>
  <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".76" numOctaves="3" seed="31" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".08"/></feComponentTransfer>
  </filter>
  <rect width="256" height="256" fill="#81b178" filter="url(#pigment)"/>
  <rect width="256" height="256" filter="url(#paper)" style="mix-blend-mode:soft-light"/>
</svg>
